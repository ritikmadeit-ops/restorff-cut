<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter</title>
<script src="../../src/runtime.js"></script>
<script type="application/json" id="params">
{
  "name": "counter",
  "title": "Counter",
  "description": "A big number counts from one value to another (accelerating, or easing out), with a label that flips when it lands: 3:23 RAW → 0:49 CUT, 0 → 1,200 BOTTLES, 37 → 100 %. Styles: plain big digits, split-flap tiles, or serif. The end value must be real (EFFECTS.md FX-32, NFR-04).",
  "duration": 3,
  "size": [1080, 1920],
  "fps": 30,
  "tags": ["number", "counter", "stat", "data", "reels"],
  "params": {
    "from": { "type": "number", "default": 0, "min": -1000000000, "max": 1000000000, "label": "From", "description": "Start value (seconds when format is time)." },
    "to": { "type": "number", "display": true, "required": true, "default": 1200, "min": -1000000000, "max": 1000000000, "label": "To", "description": "End value: the real, measured number." },
    "format": { "type": "enum", "options": ["number", "time", "percent"], "default": "number", "label": "Format", "description": "number = 1,200 · time = m:ss · percent = 100 %." },
    "decimals": { "type": "number", "default": 0, "min": 0, "max": 2, "step": 1, "label": "Decimals", "description": "Digits after the point (number/percent)." },
    "label": { "type": "string", "default": "BOTTLES A WEEK", "maxLength": 24, "label": "Label", "description": "Small caps label under the number while it counts." },
    "endLabel": { "type": "string", "default": "", "maxLength": 24, "label": "End label", "description": "Label it flips to when the count lands (e.g. RAW → CUT). Empty = keep the label." },
    "countTime": { "type": "number", "default": 1.6, "min": 0.2, "max": 20, "step": 0.05, "unit": "s", "label": "Count time", "description": "Seconds the count takes." },
    "curve": { "type": "enum", "options": ["accelerate", "ease-out", "linear"], "default": "ease-out", "label": "Curve", "description": "accelerate = slow then fast (a count-down that speeds up); ease-out = fast then settles." },
    "style": { "type": "enum", "options": ["plain", "flap", "serif"], "default": "plain", "label": "Style", "description": "plain = Archivo extended digits; flap = split-flap tiles; serif = big editorial serif." },
    "color": { "type": "color", "default": "#EDEBE6", "label": "Colour", "description": "Digit colour." },
    "accent": { "type": "color", "default": "#F6FF00", "label": "Accent", "description": "Label pill when the count lands: the isolate." },
    "scale": { "type": "number", "default": 1, "min": 0.5, "max": 2, "step": 0.01, "unit": "x", "label": "Scale", "description": "Size multiplier." },
    "anchor": { "type": "enum", "options": ["top", "center", "bottom"], "default": "center", "label": "Anchor", "description": "Vertical placement." },
    "offsetY": { "type": "number", "default": 0, "min": -700, "max": 700, "step": 1, "unit": "px", "label": "Vertical offset", "description": "Nudge, px on a 1080 grid. Negative = up." },
    "speed": { "type": "number", "default": 1, "min": 0.25, "max": 4, "step": 0.01, "unit": "x", "label": "Speed", "description": "Motion speed." },
    "exit": { "type": "boolean", "default": true, "label": "Animate out", "description": "Fades over the last 0.3 s." }
  }
}
</script>
<style>
  #stage { position: absolute; inset: 0; }
  .grp { position: absolute; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .num { display: flex; white-space: nowrap; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
  .flap { display: inline-flex; align-items: center; justify-content: center; background: #1f3a2c; color: #F4E9DA; position: relative; box-shadow: 0 8px 18px rgba(0,0,0,.4); }
  .flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: rgba(0,0,0,.45); }
  .lbl { font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  var CT = {};
  function fmt(P, v) {
    if (P.format === "time") {
      var s = Math.max(0, Math.round(v));
      var m = Math.floor(s / 60);
      var r = s % 60;
      return m + ":" + (r < 10 ? "0" : "") + r;
    }
    var n = Number(v).toFixed(P.decimals);
    var parts = n.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".") + (P.format === "percent" ? "%" : "");
  }
  RC.composition({
    build: function (RC) {
      var P = RC.params;
      var u = RC.u * P.scale;
      var stage = document.getElementById("stage");
      var grp = RC.el("div", { class: "grp" });
      var num = RC.el("div", { class: "num" });
      var widest = fmt(P, Math.abs(P.to) > Math.abs(P.from) ? P.to : P.from).replace(/[0-9]/g, "8");
      CT.slots = [];
      var size = P.style === "serif" ? 330 : P.style === "flap" ? 210 : 260;
      if (P.style === "flap") {
        for (var i = 0; i < widest.length; i++) {
          var tile = RC.el("span", { class: "flap", text: "0", style: { fontFamily: '"Archivo"', fontWeight: "800", fontSize: size * u + "px", width: (/[0-9]/.test(widest[i]) ? 0.72 : 0.42) * size * u + "px", height: size * 1.2 * u + "px", marginRight: 10 * u + "px", borderRadius: 14 * u + "px" } });
          num.appendChild(tile);
          CT.slots.push(tile);
        }
      } else {
        CT.text = RC.el("span", { text: widest, style: { color: P.color, fontFamily: P.style === "serif" ? '"Instrument Serif"' : '"Archivo"', fontWeight: P.style === "serif" ? "400" : "900", fontStretch: P.style === "serif" ? "100%" : "125%", fontSize: size * u + "px" } });
        num.appendChild(CT.text);
      }
      grp.appendChild(num);
      CT.lbl = RC.el("div", { class: "lbl", text: P.label, style: { fontSize: 34 * u + "px", marginTop: 24 * u + "px", padding: 8 * u + "px " + 16 * u + "px", borderRadius: "999px", color: P.color } });
      grp.appendChild(CT.lbl);
      stage.appendChild(grp);
      if (CT.text) {
        RC.fitText(CT.text, RC.width - 2 * RC.safe.left, size * u, 60 * RC.u);
        CT.text.style.minWidth = CT.text.offsetWidth + "px";
        CT.text.style.textAlign = "center";
      }
      var h = grp.offsetHeight;
      var top = P.anchor === "top" ? RC.safe.top : P.anchor === "bottom" ? RC.height - RC.safe.bottom - h : (RC.height - h) / 2;
      grp.style.top = top + P.offsetY * RC.u + "px";
      CT.grp = grp;
      CT.widest = widest;
    },
    render: function (time, RC) {
      var P = RC.params;
      var t = time.t;
      var out = P.exit ? 1 - RC.clamp(time.left / 0.3, 0, 1) : 0;
      var x = RC.clamp((t - 0.15) / P.countTime, 0, 1);
      var e = P.curve === "accelerate" ? x * x * x : P.curve === "ease-out" ? 1 - Math.pow(1 - x, 3) : x;
      var v = x >= 1 ? P.to : P.from + (P.to - P.from) * e;
      if (P.decimals === 0 && P.format !== "time" && x < 1) v = Math.round(v);
      var s = fmt(P, v);
      if (CT.text) CT.text.textContent = s;
      else {
        var padded = s.length < CT.slots.length ? new Array(CT.slots.length - s.length + 1).join(" ") + s : s.slice(-CT.slots.length);
        for (var i = 0; i < CT.slots.length; i++) {
          var ch = padded[i];
          CT.slots[i].textContent = ch === " " ? "" : ch;
          CT.slots[i].style.visibility = ch === " " ? "hidden" : "visible";
        }
      }
      var landed = x >= 1;
      if (P.endLabel) CT.lbl.textContent = landed ? P.endLabel : P.label;
      var pop = landed ? RC.progress(t, 0.15 + P.countTime, 0.25, "bouncy") : 0;
      CT.lbl.style.background = landed ? P.accent : "transparent";
      CT.lbl.style.color = landed ? "#0C0C0E" : P.color;
      RC.set(CT.lbl, { scale: landed ? 0.85 + 0.15 * pop : 1 });
      var inP = RC.progress(t, 0, 0.25, "snappy");
      RC.set(CT.grp, { opacity: inP * (1 - out), y: (1 - inP) * 30 * RC.u, scale: landed ? 1 + 0.04 * Math.sin(Math.min(1, (t - 0.15 - P.countTime) / 0.2) * Math.PI) : 1 });
    },
  });
</script>
</body>
</html>
