<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halftone push</title>
<script src="../../src/runtime.js"></script>
<script type="application/json" id="params">
{
  "name": "halftone-push",
  "title": "Halftone push-in",
  "description": "Collage kit: a portrait printed as a black-and-white halftone (real dots, re-drawn crisp every frame) with a slow push-in toward one eye; the iris then becomes a spinning vinyl record that grows to fill the frame, a match cut into the next scene. Use as a collage-explainer transition into music, history or a 'look closer' beat (EFFECTS.md FX-56). Full frame, opaque.",
  "duration": 4,
  "size": [1080, 1920],
  "fps": 30,
  "tags": ["collage", "halftone", "print", "push-in", "match-cut", "kit", "explainer"],
  "effect": {
    "fx": ["FX-56"],
    "stack": ["self"],
    "inputs": {
      "image": "props.image = a portrait (a photo or a still of the speaker: MCP look / a frame of the clip); props.focus = where the eye is (fractions of the image, e.g. from the face box: x - w*0.18, y - h*0.05 for the subject's right eye)",
      "match": "vinyl (drawn), an image (props.matchImage, round-cropped) or none"
    },
    "note": "Opaque full frame: it replaces the picture for its length."
  },
  "params": {
    "image": { "type": "image", "default": "assets/barista.png", "label": "Portrait", "description": "The picture printed in halftone (any size; it is cover-fitted to the frame)." },
    "focus": {
      "type": "object", "label": "Eye", "description": "The point the camera pushes into, fractions of the frame after cover-fitting (x, y) and the iris radius as a fraction of the frame width.",
      "fields": { "x": { "type": "number", "default": 0.454, "min": 0, "max": 1 }, "y": { "type": "number", "default": 0.437, "min": 0, "max": 1 }, "r": { "type": "number", "default": 0.012, "min": 0.002, "max": 0.2 } },
      "default": { "x": 0.454, "y": 0.437, "r": 0.012 }
    },
    "zoom": { "type": "number", "default": 4, "min": 1.2, "max": 12, "step": 0.1, "unit": "x", "label": "Push", "description": "How far the push-in goes before the match (4 = four times closer)." },
    "cell": { "type": "number", "default": 7, "min": 3, "max": 30, "step": 0.5, "unit": "px", "label": "Dot pitch", "description": "Distance between halftone dots on the print, px on a 1080 grid (smaller = finer print)." },
    "angle": { "type": "number", "default": 45, "min": 0, "max": 90, "step": 1, "unit": "deg", "label": "Screen angle", "description": "Angle of the dot grid (45 = classic newspaper)." },
    "contrast": { "type": "number", "default": 1.25, "min": 0.5, "max": 3, "step": 0.05, "label": "Contrast", "description": "Contrast of the print before screening." },
    "paper": { "type": "color", "default": "#EFE8DA", "label": "Paper", "description": "Paper colour." },
    "ink": { "type": "color", "default": "#16161A", "label": "Ink", "description": "Dot colour." },
    "match": { "type": "enum", "options": ["vinyl", "image", "none"], "default": "vinyl", "label": "Match object", "description": "What the iris becomes: a spinning record, props.matchImage, or nothing (a plain push-in)." },
    "matchImage": { "type": "image", "default": "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7", "label": "Match image", "description": "For match image: a picture cropped to a circle (a coin, a cup from above, a planet)." },
    "label": { "type": "string", "default": "HALCYON · SIDE A", "maxLength": 24, "label": "Record label", "description": "Text on the record's label." },
    "accent": { "type": "color", "default": "#C8553D", "label": "Label colour", "description": "Colour of the record's label." },
    "push": { "type": "number", "default": 2.4, "min": 0.3, "max": 30, "step": 0.1, "unit": "s", "label": "Push time", "description": "Seconds of the push-in before the match takes over." },
    "speed": { "type": "number", "default": 1, "min": 0.25, "max": 4, "step": 0.01, "unit": "x", "label": "Speed", "description": "Motion speed." }
  }
}
</script>
<style>
  #stage { position: absolute; inset: 0; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  var HT = {};
  var BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  function loadImg(src) { var im = new Image(); im.src = src; return im.decode().then(function () { return im; }); }
  function cover(im, W, H) {
    var s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
    return { s: s, x: (W - im.naturalWidth * s) / 2, y: (H - im.naturalHeight * s) / 2 };
  }
  RC.composition({
    build: function (RC) {
      var P = RC.params;
      var W = RC.width, H = RC.height, u = RC.u;
      var c = document.createElement("canvas");
      c.width = W; c.height = H;
      document.getElementById("stage").appendChild(c);
      HT.g = c.getContext("2d");
      var jobs = [loadImg(P.image)];
      if (P.match === "image" && P.matchImage !== BLANK) jobs.push(loadImg(P.matchImage));
      return Promise.all(jobs).then(function (ims) {
        var im = ims[0];
        HT.matchImg = ims[1] || null;
        // luminance of the cover-fitted portrait at a working resolution
        var cell = P.cell * u;
        var ws = Math.max(2, Math.round(W / cell * 2)), hs = Math.max(2, Math.round(H / cell * 2));
        var lc = document.createElement("canvas"); lc.width = ws; lc.height = hs;
        var lg = lc.getContext("2d");
        lg.imageSmoothingQuality = "high";
        var cv = cover(im, ws, hs);
        lg.drawImage(im, cv.x, cv.y, im.naturalWidth * cv.s, im.naturalHeight * cv.s);
        var px = lg.getImageData(0, 0, ws, hs).data;
        var lum = new Float32Array(ws * hs);
        for (var i = 0; i < ws * hs; i++) {
          var l = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255;
          lum[i] = RC.clamp((l - 0.5) * P.contrast + 0.5, 0, 1);
        }
        // the dot grid of the print (image space = frame px at zoom 1), rotated by the screen angle
        var a = (P.angle * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
        var reach = Math.ceil(Math.sqrt(W * W + H * H) / cell) + 2;
        var xs = [], ys = [], rs = [];
        for (var gy = -reach; gy <= reach; gy++) for (var gx = -reach; gx <= reach; gx++) {
          var x = W / 2 + (gx * ca - gy * sa) * cell, y = H / 2 + (gx * sa + gy * ca) * cell;
          if (x < -cell || y < -cell || x > W + cell || y > H + cell) continue;
          var sx = Math.min(ws - 1, Math.max(0, Math.round((x / W) * ws))), sy = Math.min(hs - 1, Math.max(0, Math.round((y / H) * hs)));
          var dark = 1 - lum[sy * ws + sx];
          if (dark < 0.04) continue;
          xs.push(x); ys.push(y); rs.push(cell * 0.62 * Math.sqrt(dark));
        }
        HT.xs = new Float32Array(xs); HT.ys = new Float32Array(ys); HT.rs = new Float32Array(rs);
        HT.cell = cell;
      });
    },
    render: function (time, RC) {
      var P = RC.params;
      var g = HT.g, W = RC.width, H = RC.height, t = time.t, T = time.T;
      // push-in: scale grows exponentially (a steady feel), the view centre slides onto the eye
      var e = RC.progress(t, 0.1, P.push, "smooth");
      var fx = P.focus.x * W, fy = P.focus.y * H;
      var s = Math.pow(P.zoom, e);
      // after the push, the match object takes over and keeps growing until it fills the frame
      var mt = 0.1 + P.push * 0.8;
      var m = P.match !== "none" ? RC.progress(t, mt, Math.max(0.3, time.duration * P.speed - mt - 0.2), "ease-in") : 0;
      var irisR = P.focus.r * W;
      var fill = Math.sqrt(W * W + H * H) * 0.55 / (irisR * P.zoom);
      s *= Math.pow(fill, m);
      var cx = RC.mix(W / 2, fx, Math.min(1, e * 1.15));
      var cy = RC.mix(H / 2, fy, Math.min(1, e * 1.15));
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = P.paper;
      g.fillRect(0, 0, W, H);
      g.setTransform(s, 0, 0, s, W / 2 - cx * s, H / 2 - cy * s);
      g.fillStyle = P.ink;
      var x0 = cx - W / 2 / s - HT.cell, x1 = cx + W / 2 / s + HT.cell, y0 = cy - H / 2 / s - HT.cell, y1 = cy + H / 2 / s + HT.cell;
      g.beginPath();
      for (var i = 0; i < HT.xs.length; i++) {
        var x = HT.xs[i], y = HT.ys[i];
        if (x < x0 || x > x1 || y < y0 || y > y1) continue;
        g.moveTo(x + HT.rs[i], y);
        g.arc(x, y, HT.rs[i], 0, Math.PI * 2);
      }
      g.fill();
      if (P.match === "none") return;
      var appear = RC.progress(t, mt - 0.35, 0.35, "linear");
      if (appear <= 0) return;
      // the match object sits on the iris, in screen space
      g.setTransform(1, 0, 0, 1, 0, 0);
      var sx = W / 2 + (fx - cx) * s, sy = H / 2 + (fy - cy) * s;
      var R = irisR * s;
      g.globalAlpha = appear;
      if (P.match === "image" && HT.matchImg) {
        g.save();
        g.beginPath(); g.arc(sx, sy, R, 0, Math.PI * 2); g.clip();
        var im = HT.matchImg, k = (2 * R) / Math.min(im.naturalWidth, im.naturalHeight);
        g.translate(sx, sy); g.rotate(T * 0.6);
        g.drawImage(im, -im.naturalWidth * k / 2, -im.naturalHeight * k / 2, im.naturalWidth * k, im.naturalHeight * k);
        g.restore();
      } else {
        // vinyl: black disc, grooves, a fixed sheen, a turning label
        g.fillStyle = "#0E0E10";
        g.beginPath(); g.arc(sx, sy, R, 0, Math.PI * 2); g.fill();
        g.lineWidth = Math.max(0.5, R * 0.006);
        for (var k = 0.36; k < 0.97; k += 0.035) {
          g.strokeStyle = "rgba(255,255,255," + (0.05 + 0.04 * Math.sin(k * 40)).toFixed(3) + ")";
          g.beginPath(); g.arc(sx, sy, R * k, 0, Math.PI * 2); g.stroke();
        }
        var sh = g.createLinearGradient(sx - R, sy - R, sx + R, sy + R);
        sh.addColorStop(0.3, "rgba(255,255,255,0)"); sh.addColorStop(0.48, "rgba(255,255,255,.16)"); sh.addColorStop(0.55, "rgba(255,255,255,0)");
        g.fillStyle = sh;
        g.beginPath(); g.arc(sx, sy, R, 0, Math.PI * 2); g.fill();
        g.save();
        g.translate(sx, sy); g.rotate(T * Math.PI * 2 * 0.55);
        g.fillStyle = P.accent;
        g.beginPath(); g.arc(0, 0, R * 0.32, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#F7F2E8";
        g.font = "700 " + Math.max(4, R * 0.055) + "px 'JetBrains Mono'";
        g.textAlign = "center";
        g.fillText(P.label, 0, -R * 0.14);
        g.font = "400 " + Math.max(4, R * 0.09) + "px 'Instrument Serif'";
        g.fillText("12 hours", 0, R * 0.2);
        g.fillStyle = "#0E0E10";
        g.beginPath(); g.arc(0, 0, R * 0.025, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      g.globalAlpha = 1;
    },
  });
</script>
</body>
</html>
