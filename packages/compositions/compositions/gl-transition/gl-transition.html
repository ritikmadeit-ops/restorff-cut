        var safe = Object.keys(GLT).filter(function (id) { return GLT[id].cover; });
        throw new Error("gl-transition: " + P.transition + " distorts pictures and only works with mode images (two pictures). For cover / in / out use one of: " + safe.join(", "));
      }
      var canvas = document.getElementById("gl");
      canvas.width = RC.width; canvas.height = RC.height;
      gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false });
      if (!gl) throw new Error("gl-transition: WebGL2 is not available in this renderer");
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS_HEAD + def.glsl + FS_TAIL));
      gl.bindAttribLocation(prog, 0, "_p");
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("gl-transition: link failed: " + gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      loc.progress = gl.getUniformLocation(prog, "progress");
      gl.uniform1i(gl.getUniformLocation(prog, "_from"), 0);
      gl.uniform1i(gl.getUniformLocation(prog, "_to"), 1);
      var r = gl.getUniformLocation(prog, "ratio");
      if (r) gl.uniform1f(r, RC.width / RC.height);
      uniformDefaults(def.glsl).forEach(setUniform);

      // one whoosh where the picture changes (the clip's middle in every mode)
      window.__rcCues = [{ t: RC.duration / 2, kind: "whoosh", label: mode === "cover" ? "the cut under the cover" : "the transition's midpoint" }];

      var w = RC.width, h = RC.height;
      return Promise.all([loadImage(P.image), loadImage(P.from), loadImage(P.to)]).then(function (imgs) {
        tex.clear = upload(plate(w, h, null, null));
        tex.fill = upload(plate(w, h, P.accent, imgs[0]));
        tex.a = upload(plate(w, h, P.background, imgs[1]));
        tex.b = upload(plate(w, h, P.accent, imgs[2]));
      });
    },
    render: function (time, RC) {
      var k = Math.max(1, P.speed);
      var p = RC.clamp((time.p - 0.5) * k + 0.5, 0, 1);
      // last frame: let `p` reach 1 exactly so cover/out end clean (time.p stops one frame short of 1)
      var lastT = RC.duration - 1 / RC.fps;
      if (time.T >= lastT - 1e-6) p = RC.clamp((1 - 0.5) * k + 0.5, 0, 1);
      var e = function (x) { return RC.ease(P.ease, RC.clamp(x, 0, 1)); };
      if (mode === "cover") {
        var hp = Math.min(0.45, (P.hold / RC.duration) * k / 2);
        var a = 0.5 - hp, b = 0.5 + hp;
        if (p < a) draw(tex.clear, tex.fill, e(p / a));
        else if (p <= b) draw(tex.clear, tex.fill, 1);
        else draw(tex.fill, tex.clear, e((p - b) / (1 - b)));
      } else if (mode === "in") draw(tex.clear, tex.fill, e(p));
      else if (mode === "out") draw(tex.fill, tex.clear, e(p));
      else draw(tex.a, tex.b, e(p));
    }
  });
})();
</script>
