<script type="application/json" id="params">
{
  "name": "lt-side-rule",
  "title": "Lower Third — Side Rule",
  "description": "Cardless lower third with a vertical accent bar; condensed display name + mono role, text-shadowed for footage. Imported from a HyperFrames block (ui-product; provenance below).",
  "duration": 4.8,
  "size": [
    1920,
    1080
  ],
  "fps": 30,
  "tags": [
    "ui-product",
    "lower-third",
    "overlay",
    "podcast",
    "interview",
    "minimal",
    "imported",
    "hyperframes"
  ],
  "kit": "hf-compat",
  "params": {
    "ltName": {
      "type": "string",
      "default": "Dr. Maya Chen",
      "label": "Lt Name",
      "description": "The text of #lt-name (div), \"Dr. Maya Chen\" in the upstream example.",
      "required": true
    },
    "ltRole": {
      "type": "string",
      "default": "Host · Neuroscientist",
      "label": "Lt Role",
      "description": "The text of #lt-role (div), \"Host · Neuroscientist\" in the upstream example."
    },
    "speed": {
      "type": "number",
      "default": 1,
      "min": 0.25,
      "max": 4,
      "step": 0.01,
      "unit": "x",
      "label": "Speed",
      "description": "Motion speed (the whole timeline runs faster or slower)."
    },
    "frameFit": {
      "type": "enum",
      "options": [
        "contain",
        "cover"
      ],
      "default": "contain",
      "label": "Frame fit",
      "description": "How the 1920x1080 design fills a render of another size: contain (all of it shows) or cover (fills, crops the edges)."
    },
    "backdrop": {
      "type": "enum",
      "options": [
        "keep",
        "transparent"
      ],
      "default": "keep",
      "label": "Backdrop",
      "description": "keep = the design's own background (a full-frame scene); transparent = only the moving parts, over the footage."
    }
  },
  "hf": {
    "vars": {
      "ltName": "rc_text_lt-name",
      "ltRole": "rc_text_lt-role"
    },
    "width": 1920,
    "height": 1080,

  },

<style data-rc-fonts>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }

      #root .lt {
        position: absolute;
        left: 130px;
        bottom: 120px;
        display: flex;
        align-items: stretch;
        gap: 26px;
      }
      #root .lt-bar {
        width: 8px;
        background: #46e5b7;
        border-radius: 4px;
        transform-origin: 50% 0%;
        flex-shrink: 0;
      }
      #root .lt-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      #root .lt-name {
        font-family: "League Gothic", sans-serif;
        font-size: 92px;
        font-weight: 400;
        color: #ffffff;
        line-height: 0.86;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.5);
      }
      #root .lt-role {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 400;
        color: #e7eaf0;
        line-height: 1.2;
        letter-spacing: 0.04em;
        white-space: nowrap;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="lt-side-rule"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4.8"
    >
      <div id="lt-clip" class="clip" data-start="0" data-duration="4.8" data-track-index="0">
        <div id="lt" class="lt">
          <div id="lt-bar" class="lt-bar"></div>
          <div class="lt-text">
            <div id="lt-name" data-var-text="rc_text_lt-name" class="lt-name">Dr. Maya Chen</div>
            <div id="lt-role" data-var-text="rc_text_lt-role" class="lt-role">Host · Neuroscientist</div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/x-rc-deferred">
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var wrap = document.getElementById("lt");
      var bar = document.getElementById("lt-bar");
      var nameEl = document.getElementById("lt-name");
      var role = document.getElementById("lt-role");

      // Vertical accent bar draws top→down, name and role slide in from the left.
      gsap.set(bar, { scaleY: 0 });
      gsap.set(nameEl, { x: -24, opacity: 0 });
      gsap.set(role, { x: -24, opacity: 0 });

      tl.to(bar, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to(nameEl, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.26);
      tl.to(role, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.38);

      // Exit: bar retracts, text lifts, hard kill.
      tl.to(role, { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.25);
      tl.to(nameEl, { y: -14, opacity: 0, duration: 0.32, ease: "power2.in" }, 4.3);
      tl.to(bar, { scaleY: 0, duration: 0.32, ease: "power2.in" }, 4.32);
      tl.set(wrap, { visibility: "hidden" }, 4.75);

      window.__timelines["lt-side-rule"] = tl;
    </script>
  <script>RC.composition(RCHF.adapt());</script>
</body>
</html>
