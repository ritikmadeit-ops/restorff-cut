<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge pills</title>
<script src="../../src/runtime.js"></script>
<script type="application/json" id="params">
{
  "name": "badge-pills",
  "title": "Badge pills",
  "description": "Mono uppercase pills (\"OPEN SOURCE\", \"APACHE-2.0\" style) stacking in one after another beside the speaker. One pill can be the neon isolate. Use for 2-5 short facts, specs or claims.",
  "duration": 3.5,
  "size": [1080, 1920],
  "fps": 30,
  "tags": ["badges", "text", "facts", "reels"],
  "params": {
    "pills": { "type": "list", "of": { "type": "string", "maxLength": 28 }, "minItems": 1, "maxItems": 6, "default": ["SMALL BATCH", "12-HOUR STEEP", "NO ADDED SUGAR", "OAT MILK READY"], "label": "Pills", "description": "Short facts, one per pill, in the order they stack in. 1-3 words each." },
    "highlight": { "type": "number", "default": 0, "min": -1, "max": 5, "step": 1, "label": "Highlighted pill", "description": "Index (0 = first) of the pill filled with the accent: the one thing to notice. -1 = none." },
    "accent": { "type": "color", "default": "#F6FF00", "label": "Accent", "description": "Fill of the highlighted pill and colour of the status dots." },
    "style": { "type": "enum", "options": ["glass", "outline", "solid"], "default": "glass", "label": "Pill style", "description": "glass = dark translucent fill, outline = bone hairline only, solid = bone fill with dark text." },
    "align": { "type": "enum", "options": ["left", "center", "right"], "default": "left", "label": "Align", "description": "Horizontal placement inside the safe area." },
    "direction": { "type": "enum", "options": ["left", "right", "up"], "default": "left", "label": "Enter from", "description": "Where each pill slides in from." },
    "times": { "type": "list", "of": { "type": "number", "min": 0 }, "maxItems": 6, "default": [], "label": "Pill times", "description": "Seconds from the overlay start when each pill lands, from the word timings (each pill on its spoken word). Real time: not changed by speed. Empty = one every `stagger`." },
    "stagger": { "type": "number", "default": 0.16, "min": 0.04, "max": 1, "step": 0.01, "unit": "s", "label": "Stagger", "description": "Delay between pills when no times are given." },
    "dots": { "type": "boolean", "default": true, "label": "Status dots", "description": "A small dot before each label." },
    "scale": { "type": "number", "default": 1, "min": 0.5, "max": 2, "step": 0.01, "unit": "x", "label": "Scale", "description": "Size multiplier." },
    "speed": { "type": "number", "default": 1, "min": 0.25, "max": 4, "step": 0.01, "unit": "x", "label": "Speed", "description": "Motion speed. 0.8 = slower, 1.25 = faster." },
    "ease": { "type": "easing", "default": "springy", "label": "Easing", "description": "How each pill lands." },
    "anchor": { "type": "enum", "options": ["top", "center", "bottom"], "default": "top", "label": "Anchor", "description": "Vertical placement inside the safe area." },
    "offsetY": { "type": "number", "default": 60, "min": -900, "max": 900, "step": 1, "unit": "px", "label": "Vertical offset", "description": "Nudge from the anchor, px on a 1080 grid. Negative = up." },
    "exit": { "type": "boolean", "default": true, "label": "Animate out", "description": "Pills leave in reverse order over the last 0.45 s." }
  }
}
</script>
<style>
  #stage { position: absolute; inset: 0; }
  .stack { position: absolute; display: flex; flex-direction: column; }
  .pill {
    display: inline-flex; align-items: center; white-space: nowrap; font-family: "JetBrains Mono", monospace;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; opacity: 0;
  }
  .pill.glass { background: rgba(22,22,26,.84); color: var(--bone); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 2px rgba(237,235,230,.16); }
  .pill.outline { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 3px rgba(237,235,230,.9); text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .pill.solid { background: var(--bone); color: #0C0C0E; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .pill.hl { color: #0C0C0E; box-shadow: 0 10px 34px rgba(0,0,0,.4); text-shadow: none; }
  .dot { border-radius: 50%; flex: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  var S = { pills: [] };
  RC.composition({
    build: function (RC) {
      var P = RC.params;
      var u = RC.u * P.scale;
      var stage = document.getElementById("stage");
      var stack = RC.el("div", { class: "stack", style: { gap: 18 * u + "px", alignItems: P.align === "left" ? "flex-start" : P.align === "right" ? "flex-end" : "center" } });
      P.pills.forEach(function (label, i) {
        var hl = i === P.highlight;
        var pill = RC.el("div", {
          class: "pill " + P.style + (hl ? " hl" : ""),
          style: { fontSize: 44 * u + "px", padding: 22 * u + "px " + 40 * u + "px", gap: 20 * u + "px", background: hl ? P.accent : null },
        }, [
          P.dots ? RC.el("span", { class: "dot", style: { width: 16 * u + "px", height: 16 * u + "px", background: hl ? "#0C0C0E" : P.style === "solid" ? "#0C0C0E" : P.accent } }) : null,
          label,
        ]);
        stack.appendChild(pill);
        S.pills.push(pill);
      });
      stage.appendChild(stack);
      var w = stack.offsetWidth;
      var h = stack.offsetHeight;
      var x = P.align === "left" ? RC.safe.left : P.align === "right" ? RC.width - RC.safe.right - w : (RC.width - w) / 2;
      var y = P.anchor === "top" ? RC.safe.top : P.anchor === "bottom" ? RC.height - RC.safe.bottom - h : (RC.height - h) / 2;
      stack.style.left = x + "px";
      stack.style.top = y + P.offsetY * RC.u + "px";
      S.u = u;
    },
    render: function (time, RC) {
      var P = RC.params;
      var u = S.u;
      var n = S.pills.length;
      var timed = P.times.length > 0;
      var clock = timed ? time.T : time.t; // word-timed pills follow the audio clock
      S.pills.forEach(function (pill, i) {
        var t0 = !timed ? 0.08 + i * P.stagger
          : i < P.times.length ? P.times[i] : P.times[P.times.length - 1] + (i - P.times.length + 1) * P.stagger;
        var k = RC.progress(clock, t0, 0.55, P.ease);
        var a = RC.progress(clock, t0, 0.12, "linear");
        var dx = P.direction === "left" ? -90 * u : P.direction === "right" ? 90 * u : 0;
        var dy = P.direction === "up" ? 70 * u : 0;
        // exit: reverse order, 0.05 s apart, over the last 0.45 s
        var out = 0;
        if (P.exit) {
          var lead = (n - 1 - i) * 0.05;
          out = RC.ease("ease-in", 1 - RC.clamp((time.left - lead) / 0.3, 0, 1));
        }
        RC.set(pill, {
          x: dx * (1 - k) + dx * 0.6 * out,
          y: dy * (1 - k),
          scale: RC.mix(0.86, 1, k) - 0.06 * out,
          opacity: a * (1 - out),
        });
      });
    },
  });
</script>
</body>
</html>
