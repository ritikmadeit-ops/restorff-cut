<script type="application/json" id="params">
{
  "name": "transitions-blur",
  "title": "Blur Transitions",
  "description": "Showcase of blur-based transitions between scenes. Imported from a HyperFrames block (transitions; provenance below).",
  "duration": 20,
  "size": [
    1920,
    1080
  ],
  "fps": 30,
  "tags": [
    "transitions",
    "transition",
    "showcase",
    "imported",
    "hyperframes"
  ],
  "opaque": true,
  "kit": "hf-compat",
  "params": {
    "titleLabel": {
      "type": "string",
      "default": "TRANSITION CATALOG",
      "label": "Title Label",
      "description": "The text of #title-label (div), \"TRANSITION CATALOG\" in the upstream example.",
      "required": true
    },
    "titleMain": {
      "type": "string",
      "default": "Blur Transitions",
      "label": "Title Main",
      "description": "The text of #title-main (div), \"Blur Transitions\" in the upstream example."
    },
    "titleCount": {
      "type": "string",
      "default": "3 transitions",
      "label": "Title Count",
      "description": "The text of #title-count (div), \"3 transitions\" in the upstream example."
    },
    "outroLabel": {
      "type": "string",
      "default": "BLUR TRANSITIONS",
      "label": "Outro Label",
      "description": "The text of #outro-label (div), \"BLUR TRANSITIONS\" in the upstream example."
    },
    "outroMain": {
      "type": "string",
      "default": "3 Transitions",
      "label": "Outro Main",
      "description": "The text of #outro-main (div), \"3 Transitions\" in the upstream example."
    },
    "speed": {
      "type": "number",
      "default": 1,
      "min": 0.25,
      "max": 4,
      "step": 0.01,
      "unit": "x",
      "label": "Speed",
      "description": "Motion speed (the whole timeline runs faster or slower)."
    },
    "frameFit": {
      "type": "enum",
      "options": [
        "contain",
        "cover"
      ],
      "default": "contain",
      "label": "Frame fit",
      "description": "How the 1920x1080 design fills a render of another size: contain (all of it shows) or cover (fills, crops the edges)."
    },
    "backdrop": {
      "type": "enum",
      "options": [
        "keep",
        "transparent"
      ],
      "default": "keep",
      "label": "Backdrop",
      "description": "keep = the design's own background (a full-frame scene); transparent = only the moving parts, over the footage."
    }
  },
  "hf": {
    "vars": {
      "titleLabel": "rc_text_title-label",
      "titleMain": "rc_text_title-main",
      "titleCount": "rc_text_title-count",
      "outroLabel": "rc_text_outro-label",
      "outroMain": "rc_text_outro-main"
    },
    "width": 1920,
    "height": 1080,
    "mode": "page",
    "needsTimeline": true
  },
  "provenance": {
    "source": "hyperframes",
    "upstream": "blocks/transitions-blur",
    "path": "registry/blocks/transitions-blur",
    "commit": "0e4a0ffbabf6dfe1b45792ae0ca23bcc6f140331",
    "licence": "Apache-2.0",
    "repo": "https://github.com/heygen-com/hyperframes.git",
    "tool": "fx-sync 0.1.0"
  }
}
</script>

    
    <meta name="viewport" content="width=1920" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .info-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.88);
        padding: 24px 60px;
        display: flex;
        align-items: center;
        gap: 40px;
        opacity: 0;
      }
      .info-num {
        font-size: 14px;
        font-weight: 700;
        color: #e07a5f;
        letter-spacing: 0.1em;
      }
      .info-name {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
      }
      .info-desc {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
      }
      #title-card {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        background: #0d1b2a;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 50;
      }
      #outro-card {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        background: #0d1b2a;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 50;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      
      <div id="title-card">
        <div
          id="title-label" data-var-text="rc_text_title-label"
          style="
            font-size: 14px;
            font-weight: 700;
            color: #e07a5f;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
          "
        >
          TRANSITION CATALOG
        </div>
        <div
          id="title-main" data-var-text="rc_text_title-main"
          style="font-size: 72px; font-weight: 900; color: #fff; margin-top: 16px; opacity: 0"
        >
          Blur Transitions
        </div>
        <div
          id="title-count" data-var-text="rc_text_title-count"
          style="
            font-size: 24px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 12px;
            opacity: 0;
          "
        >
          3 transitions
        </div>
      </div>

      
      <div id="scene1" class="scene" style="z-index: 1">
        <div class="scene-inner" id="s1" style="background: #1b263b">
          <div style="font-size: 200px; font-weight: 900; color: rgba(255, 255, 255, 0.08)">
            ONE
          </div>
          <div
            style="
              font-size: 32px;
              font-weight: 700;
              color: #778da9;
              letter-spacing: 0.15em;
              margin-top: -20px;
            "
          >
            SCENE A
          </div>
        </div>
      </div>

      
      <div id="scene2" class="scene" style="z-index: 2; opacity: 0">
        <div class="scene-inner" id="s2" style="background: #e07a5f">
          <div style="font-size: 200px; font-weight: 900; color: rgba(255, 255, 255, 0.15)">
            TWO
          </div>
          <div
            style="
              font-size: 32px;
              font-weight: 700;
              color: #fff;
              letter-spacing: 0.15em;
              margin-top: -20px;
            "
          >
            SCENE B
          </div>
        </div>
      </div>

      
      <div id="info-1" class="info-bar">
        <div class="info-num">01</div>
        <div class="info-name">Blur Through</div>
        <div class="info-desc">Use a blur through transition</div>
      </div>
      <div id="info-2" class="info-bar">
        <div class="info-num">02</div>
        <div class="info-name">Directional Blur</div>
        <div class="info-desc">Use a directional blur transition with motion skew</div>
      </div>
      <div id="info-3" class="info-bar">
        <div class="info-num">03</div>
        <div class="info-name">Calm Blur Through</div>
        <div class="info-desc">Use a slow calm blur through transition</div>
      </div>

      
      <div id="outro-card">
        <div
          id="outro-label" data-var-text="rc_text_outro-label"
          style="
            font-size: 14px;
            font-weight: 700;
            color: #e07a5f;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
          "
        >
          BLUR TRANSITIONS
        </div>
        <div
          id="outro-main" data-var-text="rc_text_outro-main"
          style="font-size: 56px; font-weight: 900; color: #fff; margin-top: 16px; opacity: 0"
        >
          3 Transitions
        </div>
      </div>
    </div>

    <script type="text/x-rc-deferred">
      (function () {
        var tl = gsap.timeline({ paused: true });
        var t = 0;

        // === TITLE CARD (3s) ===
        tl.to("#title-label", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.3);
        tl.fromTo(
          "#title-main",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          t + 0.6,
        );
        tl.fromTo(
          "#title-count",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          t + 1.0,
        );
        tl.to("#title-card", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, t + 2.4);
        t += 3;

        function resetScenes() {
          tl.set(
            "#scene1",
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              scaleX: 1,
              rotation: 0,
              filter: "none",
              clipPath: "none",
              zIndex: 1,
              skewX: 0,
            },
            t,
          );
          tl.set(
            "#scene2",
            {
              opacity: 0,
              x: 0,
              y: 0,
              scale: 1,
              scaleX: 1,
              rotation: 0,
              filter: "none",
              clipPath: "none",
              zIndex: 2,
              skewX: 0,
            },
            t,
          );
          tl.set(
            "#s1",
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              rotation: 0,
              filter: "none",
              skewX: 0,
              scaleX: 1,
              transformOrigin: "50% 50%",
            },
            t,
          );
          tl.set(
            "#s2",
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              rotation: 0,
              filter: "none",
              skewX: 0,
              scaleX: 1,
              transformOrigin: "50% 50%",
            },
            t,
          );
        }

        // === TRANSITION 1: Blur Through ===
        resetScenes();
        tl.to("#info-1", { opacity: 1, duration: 0.3 }, t + 0.2);
        var T = t + 1.5;
        tl.to(
          "#s1",
          { filter: "blur(15px)", scale: 1.05, opacity: 0, duration: 0.4, ease: "power2.in" },
          T,
        );
        tl.set("#scene2", { opacity: 1 }, T);
        tl.fromTo(
          "#s2",
          { filter: "blur(15px)", scale: 0.95, opacity: 0 },
          { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
          T + 0.2,
        );
        t = T + 1.5 + 1.0;
        tl.to("#info-1", { opacity: 0, duration: 0.2 }, t);
        t += 0.5;

        // === TRANSITION 2: Directional Blur ===
        resetScenes();
        tl.to("#info-2", { opacity: 1, duration: 0.3 }, t + 0.2);
        T = t + 1.5;
        tl.to(
          "#s1",
          {
            filter: "blur(12px)",
            skewX: -8,
            x: -200,
            opacity: 0,
            duration: 0.4,
            ease: "power3.in",
          },
          T,
        );
        tl.set("#scene2", { opacity: 1 }, T);
        tl.fromTo(
          "#s2",
          { filter: "blur(12px)", skewX: 8, x: 200, opacity: 0 },
          { filter: "blur(0px)", skewX: 0, x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          T + 0.15,
        );
        t = T + 1.5 + 1.0;
        tl.to("#info-2", { opacity: 0, duration: 0.2 }, t);
        t += 0.5;

        // === TRANSITION 3: Calm Blur Through ===
        resetScenes();
        tl.to("#info-3", { opacity: 1, duration: 0.3 }, t + 0.2);
        T = t + 1.5;
        tl.to("#s1", { filter: "blur(30px)", scale: 1.08, duration: 0.5, ease: "power1.in" }, T);
        tl.to("#s1", { opacity: 0, duration: 0.3, ease: "power1.in" }, T + 0.3);
        tl.set("#scene2", { opacity: 1 }, T + 0.3);
        tl.fromTo(
          "#s2",
          { filter: "blur(30px)", scale: 0.92, opacity: 0 },
          { filter: "blur(30px)", scale: 0.92, opacity: 1, duration: 0.2, ease: "none" },
          T + 0.5,
        );
        tl.to("#s2", { filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power1.out" }, T + 0.7);
        t = T + 1.5 + 1.0;
        tl.to("#info-3", { opacity: 0, duration: 0.2 }, t);
        t += 0.5;

        // === OUTRO (3s) ===
        tl.set("#scene1", { opacity: 0 }, t);
        tl.set("#scene2", { opacity: 0 }, t);
        tl.to("#outro-card", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, t);
        tl.to("#outro-label", { opacity: 1, duration: 0.4, ease: "power2.out" }, t + 0.3);
        tl.fromTo(
          "#outro-main",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          t + 0.6,
        );
        tl.to("#outro-card", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, t + 2.4);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  <script>RC.composition(RCHF.adapt());</script>
</body>
</html>
