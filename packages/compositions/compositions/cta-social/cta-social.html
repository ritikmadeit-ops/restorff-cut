<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social CTA</title>
<script src="../../src/runtime.js"></script>
<script type="application/json" id="params">
{
  "name": "cta-social",
  "title": "Social CTA",
  "description": "The end-card call to action in neutral, unbranded social UI: a comment box types a keyword ('Comment STEEP'), a heart fills with a burst, and a Follow button flips to Following. No real platform logos or chrome. Use on the last 3 seconds of an ad (EFFECTS.md FX-35).",
  "duration": 3.5,
  "size": [1080, 1920],
  "fps": 30,
  "tags": ["cta", "end card", "social", "ui"],
  "params": {
    "keyword": { "type": "string", "required": true, "default": "STEEP", "maxLength": 16, "label": "Keyword", "description": "The word viewers should comment." },
    "prompt": { "type": "string", "display": false, "default": "Comment", "maxLength": 20, "label": "Prompt", "description": "Word before the keyword in the headline." },
    "handle": { "type": "string", "default": "@halcyon.coldbrew", "maxLength": 28, "label": "Handle", "description": "Account name next to the Follow button (fictional)." },
    "accent": { "type": "color", "default": "#F6FF00", "label": "Accent", "description": "Keyword highlight and Follow button: the isolate." },
    "heart": { "type": "color", "default": "#FF4D6A", "label": "Heart", "description": "Heart fill colour." },
    "scale": { "type": "number", "default": 1, "min": 0.5, "max": 2, "step": 0.01, "unit": "x", "label": "Scale", "description": "Size multiplier." },
    "offsetY": { "type": "number", "default": 0, "min": -700, "max": 700, "step": 1, "unit": "px", "label": "Vertical offset", "description": "Nudge, px on a 1080 grid. Negative = up." },
    "speed": { "type": "number", "default": 1, "min": 0.25, "max": 4, "step": 0.01, "unit": "x", "label": "Speed", "description": "Motion speed." },
    "exit": { "type": "boolean", "default": false, "label": "Animate out", "description": "Fades over the last 0.3 s (off by default: it is the end card)." }
  }
}
</script>
<style>
  #stage { position: absolute; inset: 0; }
  .grp { position: absolute; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .head { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 125%; text-transform: uppercase; color: #EDEBE6; text-shadow: 0 6px 30px rgba(0,0,0,.5); white-space: nowrap; }
  .kw { display: inline-block; color: #0C0C0E; }
  .box { display: flex; align-items: center; background: rgba(237,235,230,.96); color: #0C0C0E; font-family: "Archivo", sans-serif; font-weight: 600; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  .row { display: flex; align-items: center; }
  .acct { display: flex; align-items: center; background: rgba(12,12,14,.82); color: #EDEBE6; font-family: "Archivo", sans-serif; font-weight: 700; box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .av { border-radius: 50%; flex: none; }
  .btn { font-family: "Archivo", sans-serif; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  var CS = {};
  RC.composition({
    build: function (RC) {
      var P = RC.params;
      var u = RC.u * P.scale;
      var stage = document.getElementById("stage");
      var grp = RC.el("div", { class: "grp", style: { gap: 40 * u + "px" } });
      CS.kw = RC.el("span", { class: "kw", text: P.keyword, style: { background: P.accent, padding: "0 " + 14 * u + "px", marginLeft: 18 * u + "px", borderRadius: 10 * u + "px" } });
      CS.head = RC.el("div", { class: "head", style: { fontSize: 92 * u + "px" } }, [RC.el("span", { text: P.prompt }), CS.kw]);
      grp.appendChild(CS.head);
      CS.typed = RC.el("span", { text: "" });
      CS.caret = RC.el("span", { style: { display: "inline-block", width: 4 * u + "px", height: 40 * u + "px", background: "#0C0C0E", marginLeft: 3 * u + "px", verticalAlign: "-0.15em" } });
      CS.box = RC.el("div", { class: "box", style: { width: 760 * u + "px", height: 100 * u + "px", borderRadius: 999 + "px", padding: "0 " + 36 * u + "px", fontSize: 40 * u + "px", justifyContent: "space-between" } });
      var left = RC.el("span", {}, [CS.typed, CS.caret]);
      CS.send = RC.el("span", { class: "btn", text: "Post", style: { fontSize: 32 * u + "px", color: "#8C8C95" } });
      CS.box.appendChild(left);
      CS.box.appendChild(CS.send);
      grp.appendChild(CS.box);
      var row = RC.el("div", { class: "row", style: { gap: 30 * u + "px" } });
      var NS = "http://www.w3.org/2000/svg";
      var hs = 120 * u;
      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("width", hs);
      svg.setAttribute("height", hs);
      svg.setAttribute("viewBox", "-12 -12 24 24");
      var heartD = "M0 7 C-9 0 -10 -6 -5.5 -8 C-2.5 -9 -0.8 -7 0 -5.5 C0.8 -7 2.5 -9 5.5 -8 C10 -6 9 0 0 7Z";
      CS.burst = document.createElementNS(NS, "g");
      for (var i = 0; i < 8; i++) {
        var l = document.createElementNS(NS, "line");
        var a = (i / 8) * Math.PI * 2;
        l.setAttribute("x1", Math.cos(a) * 9);
        l.setAttribute("y1", Math.sin(a) * 9);
        l.setAttribute("x2", Math.cos(a) * 12);
        l.setAttribute("y2", Math.sin(a) * 12);
        l.setAttribute("stroke", P.heart);
        l.setAttribute("stroke-width", 1.4);
        l.setAttribute("stroke-linecap", "round");
        CS.burst.appendChild(l);
      }
      svg.appendChild(CS.burst);
      CS.heartFill = document.createElementNS(NS, "path");
      CS.heartFill.setAttribute("d", heartD);
      CS.heartFill.setAttribute("fill", P.heart);
      svg.appendChild(CS.heartFill);
      var outline = document.createElementNS(NS, "path");
      outline.setAttribute("d", heartD);
      outline.setAttribute("fill", "none");
      outline.setAttribute("stroke", "#EDEBE6");
      outline.setAttribute("stroke-width", 1.4);
      svg.appendChild(outline);
      CS.heart = svg;
      row.appendChild(svg);
      var acct = RC.el("div", { class: "acct", style: { gap: 20 * u + "px", padding: 16 * u + "px " + 18 * u + "px " + 16 * u + "px " + 16 * u + "px", borderRadius: 999 + "px", fontSize: 32 * u + "px" } });
      acct.appendChild(RC.el("span", { class: "av", style: { width: 64 * u + "px", height: 64 * u + "px", background: "linear-gradient(135deg, #C8553D, #E2B84A)" } }));
      acct.appendChild(RC.el("span", { text: P.handle }));
      CS.follow = RC.el("span", { class: "btn", text: "Follow", style: { minWidth: 210 * u + "px", height: 64 * u + "px", borderRadius: 999 + "px", fontSize: 30 * u + "px", background: P.accent, color: "#0C0C0E" } });
      acct.appendChild(CS.follow);
      row.appendChild(acct);
      grp.appendChild(row);
      stage.appendChild(grp);
      RC.fitText(CS.head, RC.width - 2 * RC.safe.left, 92 * u, 40 * RC.u);
      grp.style.top = (RC.height - grp.offsetHeight) / 2 + P.offsetY * RC.u + "px";
      CS.grp = grp;
      CS.row = row;
    },
    render: function (time, RC) {
      var P = RC.params;
      var t = time.t;
      var out = P.exit ? 1 - RC.clamp(time.left / 0.3, 0, 1) : 0;
      var hp = RC.progress(t, 0, 0.35, "snappy");
      RC.set(CS.head, { y: (1 - hp) * 40 * RC.u, opacity: hp });
      RC.set(CS.kw, { scale: RC.mix(0.6, 1, RC.progress(t, 0.2, 0.3, "bouncy")) });
      var bp = RC.progress(t, 0.25, 0.35, "snappy");
      RC.set(CS.box, { y: (1 - bp) * 40 * RC.u, opacity: bp });
      var n = Math.max(0, Math.min(P.keyword.length, Math.floor((t - 0.6) * 14)));
      CS.typed.textContent = P.keyword.slice(0, n);
      var typedAll = n >= P.keyword.length;
      CS.caret.style.opacity = !typedAll || Math.floor(t * 3) % 2 === 0 ? "1" : "0";
      CS.send.style.color = typedAll ? "#0C0C0E" : "#8C8C95";
      var rp = RC.progress(t, 0.45, 0.35, "snappy");
      RC.set(CS.row, { y: (1 - rp) * 40 * RC.u, opacity: rp });
      var likeAt = 0.6 + P.keyword.length / 14 + 0.25;
      var lp = RC.progress(t, likeAt, 0.3, "bouncy");
      CS.heartFill.setAttribute("transform", "scale(" + lp + ")");
      var bt = RC.clamp((t - likeAt) / 0.35, 0, 1);
      CS.burst.setAttribute("transform", "scale(" + (0.6 + bt * 0.7) + ")");
      CS.burst.setAttribute("opacity", String(bt > 0 && bt < 1 ? 1 - bt : 0));
      RC.set(CS.heart, { scale: 1 + 0.18 * Math.sin(Math.min(1, RC.clamp((t - likeAt) / 0.25, 0, 1)) * Math.PI) });
      var followed = t >= likeAt + 0.45;
      CS.follow.textContent = followed ? "Following" : "Follow";
      CS.follow.style.background = followed ? "transparent" : P.accent;
      CS.follow.style.color = followed ? "#EDEBE6" : "#0C0C0E";
      CS.follow.style.boxShadow = followed ? "inset 0 0 0 " + 3 * RC.u + "px rgba(237,235,230,.6)" : "none";
      RC.set(CS.follow, { scale: followed ? 1 - 0.06 * Math.sin(RC.clamp((t - likeAt - 0.45) / 0.2, 0, 1) * Math.PI) : 1 });
      CS.grp.style.opacity = String(1 - out);
    },
  });
</script>
</body>
</html>
