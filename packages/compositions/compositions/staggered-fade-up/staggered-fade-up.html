    <meta name="viewport" content="width=1920, height=1080" />
    <title>Staggered Fade Up - Demo</title>
    
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: var(--bg, #f5f5f4);
        font-family: var(--font-body, Inter, system-ui, sans-serif);
      }
      /* ponytail: zoom on .demo-frame (not a GSAP target) to fill ~65% of frame */
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 72px 96px;
        zoom: 1.9;
      }
      .demo-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted, #71717a);
      }
      .hf-catalog-staggered-fade-up {
        color: var(--fg, #18181b);
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-staggered-fade-up {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 18px;
        font-size: 72px;
        line-height: 1.05;
        max-width: 680px;
        justify-content: center;
      }
      .hf-catalog-staggered-fade-up span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="staggered-fade-up-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">staggered fade up</div>
        <div
          class="hf-catalog-staggered-fade-up"
          data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where the offset the timeline drives points.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }, { "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }] },
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Scales the travel offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "The words themselves, split on spaces, one span and one stagger step each.", "default": "Staggered fade up" }
  ]'
        >
          <span>Motion</span><span>that</span><span>tells</span><span>a</span><span>story</span
          ><span>one</span><span>word</span><span>at</span><span>a</span><span>time</span>
        </div>
      </div>
      <script type="text/x-rc-deferred">
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var axes = {
            up: { x: 0, y: 1 },
            down: { x: 0, y: -1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 },
          };
          var reaches = { close: 0.5, standard: 1, far: 1.85 };
          var tones = {
            ink: "var(--fg, #18181b)",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var axis = axes[pick(axes, vars.direction, "up")];
          var reach = reaches[pick(reaches, vars.distance, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];
          var words =
            typeof vars.words === "string" && vars.words.trim()
              ? vars.words.trim().split(/\s+/)
              : null;

          var roots = document.querySelectorAll(".hf-catalog-staggered-fade-up");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-word-axis-x", String(axis.x * reach));
            roots[i].style.setProperty("--hf-word-axis-y", String(axis.y * reach));
            roots[i].style.setProperty("--hf-fade-word-color", tone);
            if (words) {
              roots[i].textContent = "";
              for (var j = 0; j < words.length; j += 1) {
                var span = document.createElement("span");
                span.textContent = words[j];
                roots[i].appendChild(span);
              }
            }
          }
        })();
      </script>
      <script type="text/x-rc-deferred">
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.4;
        tl.fromTo(
          ".hf-catalog-staggered-fade-up span",
          { opacity: 0, "--hf-word-y": "28px", "--hf-word-scale": 0.92, "--hf-word-blur": "6px" },
          {
            opacity: 1,
            "--hf-word-y": "0px",
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.4,
            stagger: 0.18,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["staggered-fade-up-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-staggered-fade-up {
        color: var(--hf-fade-word-color, var(--fg, #18181b));
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-staggered-fade-up {
        display: inline-flex;
        gap: var(--space-1, 12px);
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-staggered-fade-up span {
        display: inline-block;
        transform: translate(
            calc(var(--hf-word-x, 0px) + var(--hf-word-y, 0px) * var(--hf-word-axis-x, 0)),
            calc(var(--hf-word-y, 0px) * var(--hf-word-axis-y, 1))
          )
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        
      }
    </style>
  <script>RC.composition(RCHF.adapt());</script>
</body>
