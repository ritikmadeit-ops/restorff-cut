<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass panel kit</title>
<script src="../../src/runtime.js"></script>
<!-- Promoted from the explainer-overlay recreation's kit (docs/restorff/recreations/explainer-overlay/inputs/kit.html,
     our own code, 14 sections of that reel), generalised: no brand words in the code (every word comes from params),
     the tile icon is a param, beat times are voice cues on the fitted clock. The kit's "collapse" and "filmstrip"
     widgets became their own compositions: waveform-collapse and filmstrip-flash. -->
<script type="application/json" id="params">
{
  "name": "glass-panel-kit",
  "title": "Glass panel kit",
  "description": "The explainer overlay grammar for the top 40 % above a talking head: a section title types on top-left, a frosted dark glass panel with mono micro-labels and white icon tiles, and ONE moving part (the widget) that acts out the spoken line, every sub-beat on its spoken word (times). Lay one per beat, about every 2 s (EFFECTS.md FX-29). Widgets and the order of their labels — card: repo line, name, description, pill 1, pill 2, tile label, stats line · chips: row 1 label, row 2 label, chip 1-3 · flow: source name, source pill, ring label · install: typed request, typed reply, working status, done status, chip · log: typed lines 1-3 · chat: placeholder, typed message, zone label, chip · bars: bar 1 label, bar 2 label, picture word · repeat: the repeated line · doc: doc title, tag · grid: four '01 Step' items · comment: typed keyword, notification header, lines 1-3 · zero: the label (with big).",
  "duration": 3,
  "size": [1080, 1920],
  "fps": 30,
  "tags": ["explainer", "glass", "panel", "overlay", "kit", "ui", "beats"],
  "params": {
    "titles": { "type": "list", "minItems": 0, "maxItems": 6, "label": "Section titles", "description": "Each types on in the top left (about 0.3 s) at its time (seconds from the clip start, on the voice) and replaces the one before.",
      "of": { "type": "object", "fields": { "at": { "type": "number", "min": 0, "max": 60, "default": 0, "description": "Seconds from the clip start." }, "text": { "type": "string", "maxLength": 40, "description": "Sentence case." } } },
      "default": [{ "at": 0, "text": "This brew" }, { "at": 0.5, "text": "Halcyon Cold Brew" }] },
    "widget": { "type": "enum", "options": ["none", "card", "chips", "flow", "install", "log", "chat", "bars", "repeat", "doc", "grid", "comment", "zero"], "default": "card", "label": "Moving part", "description": "What acts out the line (see the description for each widget's labels)." },
    "labels": { "type": "list", "of": { "type": "string", "maxLength": 48 }, "minItems": 0, "maxItems": 12, "label": "Labels", "description": "The widget's words, in its own order (see the description). Missing ones stay empty.",
      "default": ["halcyon-co / cold-brew", "Halcyon Cold Brew", "Slow-steeped. Single origin. Never bitter.", "SINGLE ORIGIN", "18-HOUR STEEP", "HALCYON-CO", "4.9 rating  ·  18 h  ·  1 : 8"] },
    "times": { "type": "list", "of": { "type": "number", "min": 0, "max": 60 }, "minItems": 0, "maxItems": 12, "default": [], "label": "Beat times", "description": "Seconds from the clip start for each sub-beat (from the word timings). Empty = the widget's own timing, which fits the clip." },
    "big": { "type": "string", "default": "", "maxLength": 16, "label": "Big text", "description": "zero: the big word or number." },
    "icon": { "type": "enum", "options": ["drop", "bean", "bottle", "flame", "repeat", "send", "heart", "link"], "default": "drop", "label": "Tile icon", "description": "The icon on the white app tiles." },
    "accent": { "type": "color", "default": "#F6FF00", "label": "Accent", "description": "The one isolate: ticks and progress fills." },
    "brand": { "type": "color", "default": "#1F6F8B", "label": "Brand colour", "description": "Colour of the tile icon." },
    "scale": { "type": "number", "default": 1, "min": 0.5, "max": 2, "step": 0.01, "unit": "x", "label": "Scale", "description": "Size of the whole group." },
    "titleScale": { "type": "number", "default": 1, "min": 0.5, "max": 2.5, "step": 0.01, "unit": "x", "label": "Title size", "description": "Size of the section titles." },
    "offsetY": { "type": "number", "default": 0, "min": -300, "max": 900, "step": 1, "unit": "px", "label": "Vertical offset", "description": "Nudge the group, px on a 1080 grid. Negative = up." },
    "speed": { "type": "number", "default": 1, "min": 0.25, "max": 4, "step": 0.01, "unit": "x", "label": "Speed", "description": "Motion speed of the widget's own beats (cue times stay on the voice)." },
    "exit": { "type": "boolean", "default": true, "label": "Animate out", "description": "The group fades over the last 0.15 s." }
  }
}
</script>

  svg { display: block; }
</style>
